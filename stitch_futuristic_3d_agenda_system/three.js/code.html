<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_2 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_2" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_2');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const container = document.getElementById('threejs-canvas-container') || document.body;
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
camera.position.set(0, 0, 18);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Luz ambiente y puntual neón
const ambientLight = new THREE.AmbientLight(0x0f172a, 1.5);
scene.add(ambientLight);

const cyanPoint = new THREE.PointLight(0x00f0ff, 3, 50);
cyanPoint.position.set(10, 10, 10);
scene.add(cyanPoint);

const violetPoint = new THREE.PointLight(0xa855f7, 3, 50);
violetPoint.position.set(-10, -10, 8);
scene.add(violetPoint);

// Grid 3D de perspectiva isométrica espacial
const gridHelper = new THREE.GridHelper(50, 40, 0x00f0ff, 0x1e293b);
gridHelper.position.y = -7;
gridHelper.rotation.x = 0.2;
scene.add(gridHelper);

// Grupo interactivo de nodos holográficos de la Agenda
const nodesGroup = new THREE.Group();
scene.add(nodesGroup);

// Nodo Central Octaédrico (Núcleo de Planificación Cuántica)
const coreGeo = new THREE.OctahedronGeometry(2.8, 0);
const coreMat = new THREE.MeshPhongMaterial({
  color: 0x00f0ff,
  wireframe: true,
  emissive: 0x083344,
  shininess: 100
});
const coreMesh = new THREE.Mesh(coreGeo, coreMat);
nodesGroup.add(coreMesh);

// Anillo orbital exterior
const ringGeo = new THREE.TorusGeometry(5.2, 0.05, 16, 100);
const ringMat = new THREE.MeshBasicMaterial({ color: 0x8b5cf6, transparent: true, opacity: 0.6 });
const ringMesh = new THREE.Mesh(ringGeo, ringMat);
ringMesh.rotation.x = Math.PI / 2.3;
nodesGroup.add(ringMesh);

// Nodos orbitales de tareas y compromisos (esferas flotantes)
const orbitalNodes = [];
const nodeCount = 14;
const sphereGeo = new THREE.SphereGeometry(0.35, 16, 16);

for (let i = 0; i < nodeCount; i++) {
  const angle = (i / nodeCount) * Math.PI * 2;
  const radius = 6.5 + (i % 3) * 1.5;
  const isHighPriority = i % 4 === 0;
  
  const sphereMat = new THREE.MeshPhongMaterial({
    color: isHighPriority ? 0xf43f5e : (i % 2 === 0 ? 0x00f0ff : 0xa855f7),
    emissive: isHighPriority ? 0xe11d48 : 0x06b6d4,
    shininess: 80
  });

  const node = new THREE.Mesh(sphereGeo, sphereMat);
  node.userData = {
    angle: angle,
    speed: 0.004 + (i % 5) * 0.002,
    radius: radius,
    yOffset: (Math.sin(i * 1.8) * 3)
  };
  orbitalNodes.push(node);
  nodesGroup.add(node);
}

// Partículas estelares en el fondo
const starsGeo = new THREE.BufferGeometry();
const starCount = 350;
const starPos = new Float32Array(starCount * 3);

for (let i = 0; i < starCount * 3; i += 3) {
  starPos[i] = (Math.random() - 0.5) * 80;
  starPos[i + 1] = (Math.random() - 0.5) * 60;
  starPos[i + 2] = (Math.random() - 0.5) * 40 - 10;
}
starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starsMat = new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.15, transparent: true, opacity: 0.7 });
const starField = new THREE.Points(starsGeo, starsMat);
scene.add(starField);

// Interacción con mouse
let mouseX = 0;
let mouseY = 0;
window.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
  mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
});

// Responsive resize
window.addEventListener('resize', () => {
  const newW = container.clientWidth || window.innerWidth;
  const newH = container.clientHeight || window.innerHeight;
  camera.aspect = newW / newH;
  camera.updateProjectionMatrix();
  renderer.setSize(newW, newH);
});

// Render loop
let clock = 0;
function animate() {
  requestAnimationFrame(animate);
  clock += 0.015;

  coreMesh.rotation.x += 0.008;
  coreMesh.rotation.y += 0.012;
  ringMesh.rotation.z += 0.005;

  // Actualizar posiciones orbitales
  orbitalNodes.forEach((node) => {
    node.userData.angle += node.userData.speed;
    node.position.x = Math.cos(node.userData.angle) * node.userData.radius;
    node.position.z = Math.sin(node.userData.angle) * node.userData.radius;
    node.position.y = node.userData.yOffset + Math.sin(clock * 1.5 + node.userData.angle) * 0.8;
  });

  // Efecto suave de inclinación con mouse
  nodesGroup.rotation.y += (mouseX * 0.4 - nodesGroup.rotation.y) * 0.05;
  nodesGroup.rotation.x += (-mouseY * 0.3 - nodesGroup.rotation.x) * 0.05;

  gridHelper.position.z = (clock * 1.5) % 2;

  renderer.render(scene, camera);
}
animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_2 -->
</body>
</html>
